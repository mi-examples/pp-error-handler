version: 2
updates:
  # All npm dependencies are development dependencies (the build toolchain
  # and the React types for type checking); react is a peer dependency.
  # Updates don't change what the package ships, so they are chores and
  # don't cut a release. Minor and patch updates arrive as one pull request.
  # React, react-dom and their types must move together (react-dom's peer
  # range accepts only its own react major), so they get one group of their
  # own for every update type; a dependency joins the first group it matches.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Give the community a week to spot a compromised release before we pick it up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # TypeScript 7 breaks tsup's declaration build (rollup-plugin-dts:
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')").
      # Remove this once tsup supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
